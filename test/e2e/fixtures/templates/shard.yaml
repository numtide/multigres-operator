apiVersion: multigres.com/v1alpha1
kind: ShardTemplate
metadata:
  name: e2e-shard
  namespace: default
spec:
  multiorch:
    replicas: 1
  pools:
    default:
      type: readWrite
      # AT_LEAST_2 bootstrap must tolerate losing one cohort member.
      replicasPerCell: 3
      storage:
        size: "1Gi"
  pvcDeletionPolicy:
    whenDeleted: Delete
    whenScaled: Delete
