apiVersion: multigres.com/v1alpha1
kind: MultigresCluster
metadata:
  name: e2e-base
  namespace: default
spec:
  postgresPasswordSecretRef:
    name: multigres-admin-password
    key: password
  pvcDeletionPolicy:
    whenDeleted: Delete
    whenScaled: Delete
  cells:
    - name: "zone-a"
      zoneId: us-central1-a
  databases:
    - name: "postgres"
      default: true
      tablegroups:
        - name: "default"
          default: true
          shards:
            - name: "0-inf"
              spec:
                multiorch:
                  replicas: 1
                pools:
                  default:
                    type: readWrite
                    cells: ["zone-a"]
                    # AT_LEAST_2 bootstrap must tolerate losing one cohort member.
                    replicasPerCell: 3
                    storage:
                      size: "1Gi"
