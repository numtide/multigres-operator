apiVersion: multigres.com/v1alpha1
kind: MultigresCluster
metadata:
  name: e2e-templated
  namespace: default
spec:
  postgresPasswordSecretRef:
    name: multigres-admin-password
    key: password
  templateDefaults:
    coreTemplate: "e2e-core"
  cells:
    - name: "zone-a"
      zoneId: us-central1-a
      cellTemplate: "e2e-cell"
  databases:
    - name: "postgres"
      default: true
      tablegroups:
        - name: "default"
          default: true
          shards:
            - name: "0-inf"
              shardTemplate: "e2e-shard"
